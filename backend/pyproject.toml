[project]
name = "casecompass-backend"
version = "0.1.0"
description = "CaseCompass API - case-management workbench (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",
    "hl7>=0.4.5",
    "pyjwt>=2.9",
    "pyyaml>=6",
    "anthropic>=2.6",
    "httpx2>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "pytest-cov>=5",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mock_cm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: calls the real Anthropic API; skipped unless pytest is run with --live",
]

[tool.coverage.run]
branch = false
omit = ["*/__main__.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "DTZ", "TID", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Inject app.core.clock.Clock instead (CLAUDE.md: reference clock rule)."
"datetime.datetime.utcnow".msg = "Inject app.core.clock.Clock instead (CLAUDE.md: reference clock rule)."
"datetime.datetime.today".msg = "Inject app.core.clock.Clock instead (CLAUDE.md: reference clock rule)."
"datetime.date.today".msg = "Inject app.core.clock.Clock instead (CLAUDE.md: reference clock rule)."

[tool.ruff.lint.per-file-ignores]
# The only place allowed to read the wall clock.
"app/core/clock.py" = ["TID251"]
# The mock CM platform simulates an external system with its own wall clock.
"mock_cm/app.py" = ["TID251", "DTZ005"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "mock_cm", "tests", "alembic/env.py"]

[[tool.mypy.overrides]]
module = ["hl7", "hl7.*"]
ignore_missing_imports = true
